name: clippy debug
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cargo clippy
        run: |
          set +e
          cargo clippy -- -D warnings > /tmp/out.txt 2>&1
          python3 -c "import sys; L=open('/tmp/out.txt').read().splitlines(); K=[l for l in L if 'warning' in l.lower() or 'error' in l.lower() or '-->' in l or 'help:' in l or 'note:' in l or l.startswith('  =')]; M='\n'.join(K[-40:]); print('::error::clippy-lint-report%0A'+M.replace('%','%25').replace('\r','').replace('\n','%0A'))"
          exit 0
