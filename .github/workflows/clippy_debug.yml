name: clippy debug
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clippy_debug.yml']
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cargo clippy
        run: |
          set +e
          cargo clippy -- -D warnings > /tmp/out.txt 2>&1
          python3 - <<'EOF'
lines = open('/tmp/out.txt').read().splitlines()
keep = [l for l in lines if ('warning' in l.lower() or 'error' in l.lower()
        or '-->' in l or 'help:' in l or 'note:' in l or l.startswith('  ='))]
msg = '\n'.join(keep[-40:])
print('::error::clippy-lint-report%0A' + msg.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
EOF
          exit 0
