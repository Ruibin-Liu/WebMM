[package]
name = "webmm"
version = "0.6.1"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3.64"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
web-time = "1.1"

[dev-dependencies]
proptest = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
